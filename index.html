<!DOCTYPE html>
<html lang="ja" data-theme="light" data-theme-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom Calendar</title>
<meta name="description" content="複数アカウント重ね表示 · 月メイン · 表示ファースト">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E14" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="./styles.mobile-month.css">
</head>
<body>
<div id="sessionBanner" class="session-banner" hidden role="status">
  <div class="session-banner-text">
    <strong>セッション切れ</strong>
    <span><span id="sessionBannerCount">0</span> 件の再連携が必要です</span>
  </div>
  <button type="button" id="sessionReauthBtn" class="primary sm">再連携</button>
  <button type="button" class="icon-btn ghost" data-close-session aria-label="閉じる">×</button>
</div>

<div class="mm-app" id="app">
  <header class="mm-header">
    <div class="mm-header-top">
      <div class="mm-header-left">
        <button id="monthLabelBtn" class="month-label-btn" type="button" aria-label="年月を選択">
          <span id="monthLabel" class="month-label">—</span>
          <span class="month-chevron" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="mm-header-right">
        <div id="avatarStack" class="avatar-stack" role="button" tabindex="0" aria-label="アカウント"></div>
        <div class="status-wrap" aria-live="polite" title="タップでアカウント / 設定">
          <span id="statusDot" class="status-dot" aria-label="状態"></span>
          <span id="statusLabel" class="status-label"></span>
        </div>
      </div>
    </div>
    <div id="monthChips" class="month-chips" aria-label="月ジャンプ"></div>
  </header>
  <div class="week-header" aria-hidden="true">
    <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
  </div>
  <main id="monthGrid" class="month-grid" aria-label="月カレンダー"></main>
</div>

<section id="dayDrawer" class="day-drawer peek" aria-label="選択日の予定" data-detent="peek" hidden>
  <div class="drawer-handle" aria-hidden="true"></div>
  <div class="drawer-header">
    <h2 id="drawerDate" class="drawer-date">日付を選択してください</h2>
    <span id="drawerCount" class="drawer-count">—</span>
    <button id="drawerExpandBtn" class="icon-btn ghost" type="button" aria-label="広げる">⤢</button>
  </div>
  <div id="drawerList" class="drawer-list" role="list"></div>
  <p id="drawerHint" class="sheet-hint drawer-hint" hidden>行をタップで編集 · FABで追加</p>
</section>

<nav class="bottom-bar" aria-label="操作バー">
  <button id="prevBtn" class="bar-btn" type="button" aria-label="前月">‹</button>
  <button id="todayBtn" class="bar-btn today" type="button" aria-label="今日">今日</button>
  <button id="nextBtn" class="bar-btn" type="button" aria-label="次月">›</button>
  <div class="bar-spacer"></div>
  <button id="acctBtn" class="bar-btn ghost" type="button" aria-label="アカウント">◎</button>
</nav>

<button id="fab" class="fab" type="button" aria-label="予定を作成" hidden>＋</button>
<div id="offlineHint" class="offline-hint" hidden>オフライン · キャッシュを表示中</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="acctSheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close-acct></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">アカウント</h3>
    <p class="sheet-hint sheet-hint-top">タップで表示切替 · 長押しでSolo · セッション切れは「再連携」</p>
    <div id="acctList" class="acct-list"></div>
    <div class="sheet-actions">
      <button id="addAccountBtn" class="primary" type="button">＋ アカウントを追加</button>
      <button id="openSettingsBtn" class="ghost" type="button">⚙ 設定</button>
    </div>
  </div>
</div>

<div id="ymSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="ymTitle">
  <div class="sheet-backdrop" data-close-ym></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="ym-head">
      <h3 id="ymTitle">年月を選択</h3>
      <button type="button" class="icon-btn" data-close-ym aria-label="閉じる">×</button>
    </div>
    <div id="ymGrid" class="ym-grid"></div>
  </div>
</div>

<div id="composerSheet" class="composer-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="composerTitle">
  <div class="composer-backdrop" data-close-composer></div>
  <div class="composer-panel">
    <div class="composer-handle"></div>
    <div class="composer-head">
      <button type="button" class="ghost" data-close-composer>キャンセル</button>
      <h3 id="composerTitle">予定を追加</h3>
      <button type="button" id="composerSave" class="primary">保存</button>
    </div>
    <form id="composerForm" novalidate class="composer-body">
      <label class="field" for="composerSummary">タイトル <span class="req">*</span>
        <input id="composerSummary" name="summary" type="text" required maxlength="200" autocomplete="off" enterkeyhint="next" placeholder="例: 打ち合わせ">
      </label>
      <div class="field-row">
        <label class="field">アカウント
          <button type="button" id="composerAccountBtn" class="select-btn" aria-haspopup="dialog"><span id="composerAccountLabel">選択</span><span class="chev">▾</span></button>
          <input type="hidden" id="composerAccount" name="account">
        </label>
        <label class="field">カレンダー
          <button type="button" id="composerCalendarBtn" class="select-btn" aria-haspopup="dialog"><span id="composerCalendarLabel">primary</span><span class="chev">▾</span></button>
          <input type="hidden" id="composerCalendar" name="calendar">
        </label>
      </div>
      <label class="check-row" for="composerAllDay"><input id="composerAllDay" name="allDay" type="checkbox"><span>終日</span></label>
      <div class="field-row">
        <label class="field" for="composerStart">開始 <span class="req">*</span>
          <input id="composerStart" name="start" type="text" required placeholder="タップして選択" readonly inputmode="none">
        </label>
        <label class="field" for="composerEnd">終了 <span class="req">*</span>
          <input id="composerEnd" name="end" type="text" required placeholder="タップして選択" readonly inputmode="none">
        </label>
      </div>
      <label class="field" for="composerLocation">場所
        <input id="composerLocation" name="location" type="text" autocomplete="off" enterkeyhint="next" placeholder="任意">
      </label>
      <label class="field" for="composerDesc">メモ
        <textarea id="composerDesc" name="description" rows="3" placeholder="任意" enterkeyhint="done"></textarea>
      </label>
      <p id="composerError" class="form-error" role="alert" hidden></p>
      <div class="composer-foot-actions">
        <button type="button" id="composerDelete" class="danger" hidden>削除</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" data-close-composer>閉じる</button>
      </div>
    </form>
  </div>
</div>

<div id="composerAccountSheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-backdrop" data-close-ca-sheet></div>
  <div class="sheet-panel"><div class="sheet-handle"></div><h3 class="sheet-title">アカウントを選択</h3><div id="composerAccountList" class="acct-list"></div></div>
</div>
<div id="composerCalendarSheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-backdrop" data-close-cc-sheet></div>
  <div class="sheet-panel"><div class="sheet-handle"></div><h3 class="sheet-title">カレンダーを選択</h3><div id="composerCalendarList" class="acct-list"></div></div>
</div>

<!-- Delete confirmation — custom sheet, not OS dialog -->
<div id="deleteSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="deleteSheetTitle">
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel delete-panel">
    <div class="sheet-handle"></div>
    <h3 id="deleteSheetTitle" class="sheet-title">予定を削除</h3>
    <div class="delete-card">
      <span id="deleteSwatch" class="delete-swatch"></span>
      <div class="delete-card-body">
        <strong id="deleteTitle">—</strong>
        <small id="deleteMeta">—</small>
      </div>
    </div>
    <p class="sheet-hint">この操作は取り消せません。Google カレンダーからも削除されます。</p>
    <div class="delete-actions">
      <button type="button" id="deleteCancel" class="ghost">キャンセル</button>
      <button type="button" id="deleteOk" class="danger">削除する</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal">
    <div class="modal-head">
      <h3 id="settingsTitle">設定</h3>
      <button type="button" class="icon-btn" data-close-settings aria-label="閉じる">×</button>
    </div>
    <p class="modal-lead">OAuth と見た目。トークンは sessionStorage のためタブを閉じると再連携が必要です。</p>

    <div class="settings-block">
      <h4 class="settings-label">テーマ</h4>
      <div class="theme-seg" role="group" aria-label="テーマ">
        <button type="button" class="theme-opt" data-theme-option="light" aria-pressed="false">ライト</button>
        <button type="button" class="theme-opt" data-theme-option="dark" aria-pressed="false">ダーク</button>
        <button type="button" class="theme-opt" data-theme-option="system" aria-pressed="true">システム</button>
      </div>
    </div>

    <form id="settingsForm" class="form">
      <label>Client ID<input id="cfgClientId" type="text" inputmode="email" autocomplete="off" placeholder="xxxx.apps.googleusercontent.com" spellcheck="false"></label>
      <label>API Key<input id="cfgApiKey" type="text" autocomplete="off" placeholder="AIza..." spellcheck="false"></label>
      <div class="form-actions">
        <button id="clearCfgBtn" class="danger" type="button">ローカル設定を消す</button>
        <button class="ghost" type="button" data-close-settings>閉じる</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- legacy confirm kept hidden unused -->
<div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" hidden>
  <div class="modal modal-sm">
    <h3>予定を削除</h3>
    <p id="confirmText" class="modal-lead">この予定を削除しますか？</p>
    <div class="form-actions">
      <button id="confirmCancel" class="ghost" type="button">キャンセル</button>
      <button id="confirmOk" class="danger" type="button">削除する</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
<script type="module" src="./js/main.mobile.js"></script>
<script async defer src="https://apis.google.com/js/api.js" onload="window.__gapiLoaded && window.__gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="window.__gisLoaded && window.__gisLoaded()"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  });
}
</script>
</body>
</html>
