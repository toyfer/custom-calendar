<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Custom Calendar — Month First (Mobile)</title>
<meta name="description" content="複数アカウント重ね表示 · 月メイン · 片手操作">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.mobile-month.css">
</head>
<body>
<div class="mm-app" id="app">
  <header class="mm-header">
    <div class="mm-header-left">
      <button id="monthLabelBtn" class="month-label-btn" aria-label="年月を選択">
        <span id="monthLabel" class="month-label">—</span>
        <span class="month-chevron" aria-hidden="true">▾</span>
      </button>
      <div id="monthChips" class="month-chips" aria-label="月ジャンプ"></div>
    </div>
    <div class="mm-header-right">
      <div id="avatarStack" class="avatar-stack" role="button" tabindex="0" aria-label="アカウントフィルタ"></div>
      <span id="statusDot" class="status-dot" aria-label="状態"></span>
    </div>
  </header>
  <div class="week-header" aria-hidden="true">
    <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
  </div>
  <main id="monthGrid" class="month-grid" aria-label="月カレンダー"></main>
  <section id="dayDrawer" class="day-drawer peek" aria-label="選択日の予定">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-header">
      <h2 id="drawerDate" class="drawer-date">—</h2>
      <span id="drawerCount" class="drawer-count">—</span>
    </div>
    <div id="drawerList" class="drawer-list"></div>
    <button id="drawerAddBtn" class="drawer-add" type="button">＋ この日に追加</button>
  </section>
  <nav class="bottom-bar" aria-label="操作バー">
    <button id="prevBtn" class="bar-btn" aria-label="前月">‹</button>
    <button id="todayBtn" class="bar-btn today" aria-label="今日">今日</button>
    <button id="nextBtn" class="bar-btn" aria-label="次月">›</button>
    <div class="bar-spacer"></div>
    <button id="acctBtn" class="bar-btn ghost" aria-label="アカウント">◎</button>
  </nav>
  <button id="fab" class="fab" aria-label="予定を作成">＋</button>
  <div id="offlineHint" class="offline-hint" hidden>オフライン · キャッシュを表示中</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<div id="acctSheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close-acct></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">アカウント</h3>
    <div id="acctList" class="acct-list"></div>
    <div style="display:flex; gap:8px; margin-top:12px">
      <button id="addAccountBtn" class="primary" style="flex:1">＋ アカウントを追加</button>
      <button id="openSettingsBtn" class="ghost" style="flex:0 0 auto">⚙ 設定</button>
    </div>
    <p class="sheet-hint">タップで表示/非表示 · 色は重ね表示で区別</p>
  </div>
</div>
<dialog id="ymPicker" class="ym-picker">
  <div class="ym-head">
    <h3>年月を選択</h3>
    <button class="icon-btn" onclick="this.closest('dialog').close()" aria-label="閉じる">×</button>
  </div>
  <div id="ymGrid" class="ym-grid"></div>
</dialog>
<div id="settingsModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3 id="settingsTitle">設定</h3><button type="button" class="icon-btn" data-close-settings>×</button></div>
    <p class="modal-lead">OAuth 認証情報。localStorageに保存すると config.json より優先されます。</p>
    <form id="settingsForm" class="form">
      <label>Client ID<input id="cfgClientId" type="text" placeholder="xxxx.apps.googleusercontent.com"></label>
      <label>API Key<input id="cfgApiKey" type="text" placeholder="AIza..."></label>
      <div class="form-actions"><button id="clearCfgBtn" class="danger" type="button">ローカル設定を消す</button><button class="ghost" type="button" data-close-settings>閉じる</button><button class="primary" type="submit">保存</button></div>
    </form>
  </div>
</div>
<div id="editModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="editTitleLabel" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3 id="editTitleLabel">予定を編集</h3><button type="button" class="icon-btn" data-close-edit>×</button></div>
    <p id="editMeta" class="modal-lead"></p>
    <form id="editForm" class="form">
      <label>タイトル<input id="editTitle" type="text" required></label>
      <div class="form-row"><label>開始<input id="editStart" type="datetime-local" required></label><label>終了<input id="editEnd" type="datetime-local" required></label></div>
      <label class="check-row"><input id="editAllDay" type="checkbox"><span>終日</span></label>
      <label>場所<input id="editLocation" type="text"></label>
      <label>メモ<textarea id="editDesc"></textarea></label>
      <div class="form-actions"><button id="editDelete" class="danger" type="button">削除</button><button id="editCancel" class="ghost" type="button">キャンセル</button><button class="primary" type="submit">保存</button></div>
    </form>
  </div>
</div>
<div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" style="display:none">
  <div class="modal modal-sm"><h3>予定を削除</h3><p id="confirmText" class="modal-lead">この予定を削除しますか？</p><div class="form-actions"><button id="confirmCancel" class="ghost" type="button">キャンセル</button><button id="confirmOk" class="danger" type="button">削除する</button></div></div>
</div>
<script type="module" src="./js/main.mobile.js"></script>
<script async defer src="https://apis.google.com/js/api.js" onload="window.__gapiLoaded && window.__gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="window.__gisLoaded && window.__gisLoaded()"></script>
</body>
</html>
